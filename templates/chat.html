{% extends 'base.html' %}
{% block content %}
  <section class="page-shell chat-shell">
    <div class="chat-layout">
      <aside class="companion-rail">
        <div class="companion-illustration large-photo">
          <div class="ghost-character ghost-chat-figure">
            <div class="ghost-head"></div>
            <div class="ghost-orbit orbit-one"></div>
            <div class="ghost-orbit orbit-two"></div>
            <div class="ghost-orbit orbit-three"></div>
          </div>
          <div class="reading-chair compact-chair">
            <div class="chair-seat"></div>
            <div class="chair-back"></div>
            <div class="chair-book"></div>
          </div>
        </div>
        <div class="companion-caption">
          <p class="eyebrow">Companion</p>
          <h3>Moonlit friend</h3>
          <p>Soft, reflective, and ready to listen in English, Tamil, or Hindi.</p>
        </div>
      </aside>

      <div class="auth-card wide-card">
        <div class="card-header center">
          <p class="eyebrow">Poetry companion</p>
          <h2>Chat with your inner voice</h2>
        </div>

        <div class="prompt-pills" aria-label="Quick prompts">
          <button type="button" class="prompt-btn" data-prompt="I feel lonely">I feel lonely</button>
          <button type="button" class="prompt-btn" data-prompt="நான் மனசு சோர்ந்துவிட்டது">தமிழ்</button>
          <button type="button" class="prompt-btn" data-prompt="main dukhi hoon">हिंदी</button>
        </div>

        <div id="chatbox" class="chatbox" aria-live="polite"></div>

        <form id="chat-form" class="stack-form chat-form">
          <label>
            <span>Your thought</span>
            <input id="msg" autocomplete="off" placeholder="Tell me what you feel...">
          </label>
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script src="/static/js/chat.js"></script>
{% endblock %}
