{% extends 'base.html' %}

{% block content %}

<section class="auth-shell">

    <div class="auth-card admin-card">

        <p class="eyebrow">Your writing desk</p>

        <h2>Admin Dashboard</h2>

        <p style="color:#aaa; margin-bottom:25px;">
            Logged in as administrator.
        </p>

        <form
            method="post"
            action="/admin/poem/new"
            enctype="multipart/form-data"
            class="stack-form"
        >

            <label>
                <span>Title</span>
                <input
                    name="title"
                    placeholder="Moonlit Silence"
                    required
                >
            </label>

            <label>
                <span>Category</span>
                <input
                    name="category"
                    placeholder="Love, grief, memory..."
                >
            </label>

            <label>
                <span>Poem text</span>
                <textarea
                    name="body"
                    rows="10"
                    placeholder="Paste your poem here..."
                    required
                ></textarea>
            </label>

            <label>
                <span>Profile image</span>
                <input
                    type="file"
                    name="profile_image"
                    accept="image/*"
                >
            </label>

            <button type="submit">
                Publish poem
            </button>

        </form>

        <p id="offline-sync-notice" class="muted"></p>

    </div>

</section>

<div style="max-width:1000px; margin:20px auto;">
    <a href="/admin/viewers">
        Viewers & Tokens →
    </a>
</div>

<script src="/static/js/admin_offline.js"></script>

{% endblock %}
