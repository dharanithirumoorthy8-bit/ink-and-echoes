{% extends 'base.html' %}

{% block content %}

<style>

/* =========================================================
   MOONLIT MARGINALIA — PREMIUM ADMIN DASHBOARD
   ========================================================= */

.admin-page {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 65px 0 100px;
    color: #e8e8ed;
}

/* ================= HEADER ================= */

.admin-hero {
    position: relative;
    text-align: center;
    margin-bottom: 55px;
    padding: 20px 10px;
}

.admin-hero::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 300px;
    left: 50%;
    top: -100px;
    transform: translateX(-50%);
    background: radial-gradient(
        ellipse,
        rgba(107,63,160,.18),
        transparent 70%
    );
    pointer-events: none;
}

.admin-hero-symbol {
    position: relative;
    color: #00d4ff;
    font-size: 28px;
    margin-bottom: 12px;
}

.admin-kicker {
    position: relative;
    color: #00d4ff;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 12px;
}

.admin-hero h1 {
    position: relative;
    margin: 0;
    font-family: Georgia, serif;
    font-size: clamp(40px, 6vw, 66px);
    line-height: 1.1;
    color: #eeeeee;
}

.admin-hero h1 span {
    color: #9666ca;
}

.admin-subtitle {
    position: relative;
    max-width: 650px;
    margin: 18px auto 0;
    color: #929baa;
    font-size: 15px;
    line-height: 1.8;
}

.admin-subtitle em {
    color: #c5a8df;
}

.admin-divider {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 230px;
    margin: 25px auto;
    color: #9666ca;
}

.admin-divider span {
    flex: 1;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #34445c,
        transparent
    );
}

.admin-login-status {
    position: relative;
    display: inline-block;
    padding: 8px 17px;
    margin: 0;
    border: 1px solid rgba(0,212,255,.17);
    border-radius: 30px;
    background: rgba(0,212,255,.035);
    color: #8f99a8;
    font-size: 12px;
}


/* ================= ADD POEM CARD ================= */

.admin-add-card {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(28,43,70,.94),
            rgba(13,18,26,.98)
        );

    border: 1px solid #2d4261;
    border-radius: 24px;
    padding: 38px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.025);

    margin-bottom: 28px;
}

.admin-add-card::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    right: -150px;
    top: -150px;
    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(0,212,255,.08),
        transparent 70%
    );

    pointer-events: none;
}

.admin-add-card::after {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    left: -150px;
    bottom: -180px;
    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(107,63,160,.10),
        transparent 70%
    );

    pointer-events: none;
}

.admin-card-heading {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
    margin-bottom: 32px;
}

.admin-label {
    margin: 0 0 7px;
    color: #00d4ff;
    font-size: 10px;
    letter-spacing: 2.5px;
    font-weight: 700;
}

.admin-card-heading h2 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 31px;
    color: #f1f1f1;
}

.admin-card-heading p:last-child {
    margin-top: 7px;
    color: #8994a4;
    font-size: 14px;
}

.admin-card-icon {
    width: 62px;
    height: 62px;
    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 50%;

    color: #00d4ff;
    font-size: 28px;

    background: rgba(0,212,255,.055);
    border: 1px solid rgba(0,212,255,.22);

    box-shadow:
        0 0 30px rgba(0,212,255,.05);
}


/* ================= FORM ================= */

.admin-form {
    position: relative;
    z-index: 2;

    display: flex;
    flex-direction: column;
    gap: 24px;
}

.admin-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.admin-field {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.admin-field > span {
    color: #aab3c1;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 700;
}

.admin-field input,
.admin-field textarea {
    width: 100%;
    box-sizing: border-box;

    border: 1px solid #2d405d;
    border-radius: 11px;

    background: rgba(5,9,15,.72);
    color: #eeeeee;

    padding: 14px 16px;

    font-family: Georgia, serif;
    font-size: 15px;

    outline: none;

    transition: .25s ease;
}

.admin-field input::placeholder,
.admin-field textarea::placeholder {
    color: #596475;
}

.admin-field input:focus,
.admin-field textarea:focus {
    border-color: #8055b7;

    box-shadow:
        0 0 0 3px rgba(128,85,183,.12),
        0 10px 25px rgba(0,0,0,.12);
}

.admin-field input {
    min-height: 52px;
}

.admin-field textarea {
    min-height: 280px;
    resize: vertical;
    line-height: 1.85;
}


/* ================= POEM EDITOR ================= */

.poem-editor {
    position: relative;
}

.poem-editor textarea {
    padding: 35px 48px;
}

.editor-mark {
    position: absolute;
    left: 17px;
    top: 8px;

    color: #7045a4;
    font-family: Georgia, serif;
    font-size: 38px;

    pointer-events: none;
    z-index: 2;
}

.editor-mark.bottom {
    left: auto;
    right: 17px;
    top: auto;
    bottom: -3px;
}


/* ================= IMAGE UPLOAD ================= */

.file-upload-box {
    min-height: 80px;

    display: flex;
    align-items: center;
    gap: 15px;

    padding: 14px 17px;

    border: 1px dashed #3a4d69;
    border-radius: 12px;

    background: rgba(5,9,15,.42);

    transition: .25s ease;
}

.file-upload-box:hover {
    border-color: #6d4c91;
    background: rgba(107,63,160,.045);
}

.file-icon {
    width: 45px;
    height: 45px;
    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: rgba(107,63,160,.14);
    color: #a172d1;
    font-size: 21px;
}

.file-upload-text {
    flex: 1;
}

.file-upload-text strong {
    display: block;
    color: #e6e6e8;
    font-size: 14px;
}

.file-upload-text small {
    display: block;
    color: #697587;
    margin-top: 4px;
}

.file-upload-box input[type="file"] {
    flex: 1;
    max-width: 300px;
    border: 0;
    background: transparent;
    padding: 0;
    color: #8994a4;
}


/* ================= PUBLISH ================= */

.admin-publish-btn {
    width: 100%;

    border: 1px solid rgba(157,110,216,.30);
    border-radius: 12px;

    padding: 17px 20px;

    background:
        linear-gradient(
            135deg,
            #7042a6,
            #50317b
        );

    color: white;

    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;

    cursor: pointer;

    transition: .25s ease;
}

.admin-publish-btn span {
    margin-right: 8px;
    color: #d8c2ef;
}

.admin-publish-btn strong {
    float: right;
    font-size: 19px;
}

.admin-publish-btn:hover {
    transform: translateY(-2px);

    border-color: #9c72c8;

    box-shadow:
        0 14px 35px rgba(107,63,160,.30);
}


/* ================= OFFLINE NOTICE ================= */

#offline-sync-notice {
    position: relative;
    z-index: 2;

    margin: 12px 0 0;

    color: #647083;
    font-size: 11px;
}


/* ================= VIEWERS ================= */

.admin-tools {
    display: flex;
    justify-content: center;
    margin: 25px 0 70px;
}

.admin-tool-link {
    width: min(100%, 520px);

    display: flex;
    align-items: center;
    gap: 15px;

    padding: 18px 21px;

    box-sizing: border-box;

    border: 1px solid #2c405d;
    border-radius: 14px;

    background: rgba(20,29,44,.70);

    color: #ddd;
    text-decoration: none;

    transition: .25s ease;
}

.admin-tool-link > span {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: rgba(0,212,255,.05);

    color: #00d4ff;
    font-size: 17px;
}

.admin-tool-link div {
    flex: 1;
}

.admin-tool-link strong {
    display: block;
    color: #e5e5e7;
    font-size: 14px;
}

.admin-tool-link small {
    display: block;
    color: #6e7a8c;
    margin-top: 3px;
}

.admin-tool-link b {
    color: #8b5cc7;
    font-size: 20px;
}

.admin-tool-link:hover {
    transform: translateY(-2px);
    border-color: #714aa0;

    box-shadow:
        0 12px 30px rgba(0,0,0,.18);
}


/* ================= SECTIONS ================= */

.admin-section {
    margin-bottom: 75px;
}

.admin-section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 24px;
}

.admin-section-heading h2 {
    margin: 4px 0 0;

    color: #eeeeee;

    font-family: Georgia, serif;
    font-size: 30px;
}

.section-symbol {
    color: #8055b7;
    font-size: 28px;
}


/* ================= POEMS ================= */

.admin-poem-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
}

.admin-poem-card {
    position: relative;
    overflow: hidden;

    min-height: 235px;

    padding: 23px;

    border: 1px solid #293c58;
    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(24,34,50,.88),
            rgba(15,21,30,.90)
        );

    transition: .25s ease;
}

.admin-poem-card::after {
    content: "";
    position: absolute;

    width: 170px;
    height: 170px;

    right: -100px;
    bottom: -100px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(107,63,160,.13),
        transparent 70%
    );

    pointer-events: none;
}

.admin-poem-card:hover {
    transform: translateY(-5px);

    border-color: #65458e;

    box-shadow:
        0 18px 40px rgba(0,0,0,.25);
}

.poem-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 23px;
}

.poem-number {
    color: #566477;
    font-size: 12px;
}

.poem-status {
    padding: 5px 9px;

    border-radius: 20px;

    background: rgba(0,212,255,.045);

    color: #00d4ff;

    font-size: 9px;
    letter-spacing: 1.5px;
}

.admin-poem-card h3 {
    margin: 0 0 11px;

    color: #eeeeee;

    font-family: Georgia, serif;
    font-size: 21px;
}

.poem-preview {
    min-height: 72px;

    margin: 0;

    color: #8994a4;

    font-size: 13px;
    line-height: 1.75;
}

.poem-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-top: 20px;
    padding-top: 15px;

    border-top: 1px solid #243248;
}

.poem-card-footer > span {
    color: #69778a;
    font-size: 11px;
}

.delete-poem-btn {
    border: 1px solid rgba(244,67,54,.28);
    border-radius: 7px;

    padding: 7px 12px;

    background: rgba(244,67,54,.05);

    color: #ef7770;

    cursor: pointer;

    font-size: 11px;

    transition: .2s ease;
}

.delete-poem-btn:hover {
    background: rgba(244,67,54,.13);
    border-color: rgba(244,67,54,.55);
