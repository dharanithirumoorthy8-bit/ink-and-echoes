{% extends 'base.html' %}
{% block content %}
  <div class="page-shell poems-shell">
    <div class="section-heading centered-heading">
      <p class="eyebrow center">Collection</p>
      <h2>Poems</h2>
    </div>

    <div class="poems-list">
      {% for p in poems %}
        <article class="poem poem-card">
          <span class="pill">Poem</span>
          <h3>{{ p.title }}</h3>
          <div class="body">{{ p.body }}</div>
        </article>
      {% else %}
        <article class="poem poem-card empty-poem">
          <span class="pill">Poem</span>
          <h3>Still waiting for the first line</h3>
          <div class="body">No poems are published yet. Check back soon.</div>
        </article>
      {% endfor %}
    </div>
  </div>
{% endblock %}
